<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MuscuQuest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --card:#161a23; --card2:#1d2230; --line:#2a3142;
  --txt:#eef1f7; --mut:#8b93a7; --acc:#7cff6b; --acc2:#39c6ff; --warn:#ffb84d; --bad:#ff5d6c; --gold:#ffd54a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.big{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.3px;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
a{color:var(--acc2)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--acc);color:#071205;font-weight:700;border-radius:12px;padding:12px 14px;width:100%;font-size:15px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;width:auto;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2530}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header.top h1{font-size:26px}
header.top h1 span{color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0d12ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:10px 0 12px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--acc)}
.hero{background:radial-gradient(circle at 80% 0%,#1f3a2a 0,var(--card) 60%);}
.lvl{width:68px;height:68px;border-radius:18px;background:var(--card2);color:#071205;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;line-height:1}
.lvl small{font-size:11px}.lvl span{font-size:28px}
.stat{margin-top:8px}
.stat .row{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:12px}
.badge .e{font-size:24px;display:block}
.badge.off{opacity:.3;filter:grayscale(1)}
.quest{display:flex;gap:10px;align-items:center;margin:10px 0}
.quest .e{font-size:22px}
.quest .grow{flex:1}
.ex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ex:first-child{border:0;margin:0;padding:0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.set .n{color:var(--mut);font-size:13px;text-align:center}
.set input{padding:7px 8px;text-align:center}
.chk{width:44px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px}
.chk.on{background:var(--acc);color:#071205;border-color:var(--acc)}
.coach{background:#132030;border:1px solid #1f3a55;color:#bfe6ff;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:calc(100% - 28px);max-width:532px;background:var(--card2);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;display:none;z-index:20;box-shadow:0 10px 30px #000a}
.timer.show{display:flex}
.timer .t{font-family:'Barlow Condensed';font-size:30px;font-weight:700;color:var(--acc);min-width:76px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:24px}
.demo{background:radial-gradient(ellipse at 50% 30%,#fbf9f6 0,#e4ded6 80%);overflow:hidden;border:1px solid var(--line);border-radius:14px;margin:12px 0;position:relative}
.demo svg{display:block;width:100%;height:auto}
.demo .lab{position:absolute;top:8px;left:10px;font-size:11px;color:#7a7f87}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin:5px 0}
.err li{margin:4px 0;color:#ffc9cf}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button,.vbtn{white-space:nowrap;padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.tabs button.on,.vbtn.on{background:var(--acc);color:#071205;border-color:var(--acc);font-weight:600}
.exitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.exitem:first-child{border:0}
.exitem .ico{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.exitem .grow{flex:1;min-width:0}
canvas{width:100%;height:200px;display:block}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lb:first-child{border:0}
.lb .r{width:26px;font-family:'Barlow Condensed';font-weight:700;font-size:18px;color:var(--mut)}
.lb.me{color:var(--acc)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:12px;z-index:50;transition:transform .35s;font-weight:600;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.levelup{font-family:'Barlow Condensed';font-size:40px;color:var(--gold);text-align:center;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.nb{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bossE{font-size:48px;width:66px;text-align:center;animation:bob 2.4s ease-in-out infinite}.bossE.dead{filter:grayscale(1);opacity:.5;animation:none;transform:rotate(90deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.empty{text-align:center;color:var(--mut);padding:20px 0}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.checkrow input{width:20px;height:20px}

/* ===== passe de simplification ===== */
:root{--bg:#0f1115;--card:#171a20;--card2:#1f232b;--line:#2a2f38;--txt:#f1f2f4;--mut:#9199a5;--acc:#ff7a1a;--acc2:#ff7a1a;--gold:#e9b949}
html,body{font-size:15px}
h1,h2,h3,.big{font-family:'Barlow Condensed',Inter,sans-serif;font-weight:700;letter-spacing:.2px}
header.top h1{font-size:28px;text-transform:uppercase;letter-spacing:.5px}header.top h1 span{color:var(--acc)}
.card{border-radius:14px;border-color:#22262e}
.hero{background:var(--card)}
.btn{color:#140a02;border-radius:12px}.btn.sec{color:var(--txt)}
.lvl{background:var(--card2);color:var(--txt);border:2px solid var(--acc)}
.chk.on{background:var(--acc);border-color:var(--acc);color:#140a02}
.tabs button.on,.vbtn.on{background:var(--txt);color:#111;border-color:var(--txt)}
nav button.on{color:var(--acc)}nav button svg{width:22px;height:22px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);position:relative;color:var(--txt)}
.iconbtn svg{width:19px;height:19px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:18px 2px 8px;font-weight:600}
.row-link{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}.row-link:first-child{border-top:0}
.coach{background:var(--card2);border:0;border-left:3px solid var(--acc);color:var(--txt)}
.toast{border-color:var(--line)}
.levelup{color:var(--acc)}
[hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>
<div class="timer" id="timer">
  <div class="t" id="timerT">1:30</div>
  <div style="flex:1"><div class="mut">Repos</div><div class="bar"><i id="timerBar" style="width:100%"></i></div></div>
  <button class="btn sec sm" onclick="addRest(-15)">−15</button>
  <button class="btn sec sm" onclick="addRest(15)">+15</button>
  <button class="btn sm" onclick="stopRest()">OK</button>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<nav><div class="in" id="nav"></div></nav>

<script>
/* ================== DONNÉES ================== */
const CATS=["Pectoraux","Épaules","Dos","Biceps","Triceps","Avant-bras","Quadriceps","Ischios","Fessiers","Mollets","Abdos","Cardio"];
const CAT_ICO={"Pectoraux":"🛡️","Épaules":"🦅","Dos":"🪽","Biceps":"💪","Triceps":"🔻","Avant-bras":"✊","Quadriceps":"🦵","Ischios":"🦿","Fessiers":"🍑","Mollets":"🦶","Abdos":"🧱","Cardio":"❤️‍🔥"};
const RAW=[
/* ---------- PECTORAUX ---------- */
["bench","Développé couché","🏋️","Pectoraux","Pectoraux|Triceps|Épaules (avant)","Barre + banc","bench","b",["Allonge-toi, les yeux sous la barre, pieds bien à plat au sol.","Serre les omoplates et garde une légère cambrure naturelle.","Descends la barre contrôlée jusqu'au bas des pectoraux, coudes à ~45° du corps.","Pousse fort vers le haut sans décoller les fesses du banc."],["Faire rebondir la barre sur la poitrine","Coudes écartés à 90°","Fesses qui décollent du banc"],["dbbench","chestpress","pushup"]],
["dbbench","Développé couché haltères","💪","Pectoraux","Pectoraux|Triceps","Haltères + banc","dbbench","b",["Allonge-toi avec un haltère dans chaque main au niveau de la poitrine.","Omoplates serrées, pieds au sol.","Pousse les haltères vers le haut en les rapprochant légèrement.","Redescends lentement jusqu'à sentir l'étirement des pectoraux."],["Descendre trop vite","Taper les haltères en haut"],["bench","chestpress"]],
["inclbench","Développé incliné barre","📐","Pectoraux","Haut des pectoraux|Épaules|Triceps","Barre + banc incliné","incl","b",["Règle le banc entre 30 et 45°.","Omoplates serrées, pieds au sol.","Descends la barre vers le haut de la poitrine.","Pousse à la verticale sans décoller le dos."],["Banc trop incliné (ça devient les épaules)","Barre qui descend trop bas sur le ventre"],["inclDb","inclpushup"]],
["inclDb","Développé incliné haltères","📐","Pectoraux","Haut des pectoraux|Épaules","Haltères + banc incliné","inclDb","",["Banc à 30–45°, haltères au niveau des épaules.","Pousse vers le haut en rapprochant les haltères.","Contrôle la descente jusqu'à l'étirement.","Garde les poignets droits."],["Cambrer fort le dos","Amplitude trop courte"],["inclbench","cablefly"]],
["declbench","Développé décliné","📉","Pectoraux","Bas des pectoraux|Triceps","Barre + banc décliné","decl","b",["Bloque bien tes jambes sous les boudins.","Descends la barre vers le bas des pectoraux.","Pousse vers le haut de façon contrôlée.","Demande un pareur si tu charges lourd."],["Rebond sur la poitrine","Prendre trop lourd sans pareur"],["dipschest","bench"]],
["chestpress","Chest press (machine)","🪑","Pectoraux","Pectoraux|Triceps","Machine","chestpress","",["Règle le siège pour que les poignées soient à hauteur de poitrine.","Dos bien collé au dossier.","Pousse jusqu'à presque tendre les bras.","Reviens lentement."],["Décoller le dos","Verrouiller les coudes"],["bench","dbbench"]],
["pushup","Pompes","🤸","Pectoraux","Pectoraux|Triceps|Gainage","Poids du corps","pushup","w",["Mains un peu plus larges que les épaules, corps bien droit.","Contracte les abdos et les fessiers.","Descends la poitrine près du sol, coudes vers l'arrière (~45°).","Remonte en poussant le sol, sans casser le dos."],["Bassin qui s'affaisse","Fesses trop hautes","Amplitude trop courte"],["inclpushup","bench"]],
["inclpushup","Pompes inclinées (débutant)","🪜","Pectoraux","Pectoraux|Triceps","Banc ou table","inclpushup","w",["Mains sur un banc ou une table stable.","Corps gainé et droit.","Descends la poitrine vers le banc.","Repousse jusqu'aux bras tendus."],["Bassin qui tombe","Mains trop écartées"],["pushup","chestpress"]],
["fly","Écarté couché haltères","🦋","Pectoraux","Pectoraux","Haltères + banc","fly","",["Allongé, haltères au-dessus de la poitrine, coudes légèrement fléchis.","Ouvre les bras en arc de cercle.","Descends jusqu'à sentir l'étirement des pectoraux.","Referme en serrant les pectoraux."],["Bras tendus (danger pour les coudes)","Descendre trop bas"],["cablefly","pecdeck"]],
["cablefly","Écarté à la poulie (vis-à-vis)","🎯","Pectoraux","Pectoraux","Poulies","flyfront","",["Une poignée dans chaque main, un pied en avant.","Coudes légèrement fléchis, buste un peu penché.","Ramène les mains devant toi en arc de cercle.","Serre 1 seconde puis reviens lentement."],["Plier et tendre les coudes (ça devient un développé)","Prendre trop lourd"],["pecdeck","fly"]],
["pecdeck","Pec deck (butterfly)","🦋","Pectoraux","Pectoraux","Machine","pecdeck","",["Règle le siège : poignées à hauteur de poitrine.","Dos collé au dossier.","Ramène les bras devant toi.","Reviens lentement sans laisser claquer les poids."],["Hausser les épaules","Mouvement trop rapide"],["cablefly","fly"]],
["dipschest","Dips (pectoraux)","⏬","Pectoraux","Bas des pectoraux|Triceps","Barres parallèles","dipsLean","w",["Bras tendus sur les barres, penche le buste vers l'avant.","Descends jusqu'à ~90° aux coudes.","Coudes légèrement écartés.","Remonte en poussant fort."],["Descendre trop bas (épaules)","Hausser les épaules"],["declbench","pushup"]],

/* ---------- ÉPAULES ---------- */
["ohp","Développé militaire","🙌","Épaules","Épaules|Triceps","Barre","ohp","b",["Debout, barre en haut de la poitrine, mains un peu plus larges que les épaules.","Serre les fessiers et les abdos pour ne pas cambrer.","Pousse la barre à la verticale au-dessus de la tête.","Redescends contrôlé jusqu'au menton."],["Se cambrer en arrière","Pousser la barre vers l'avant"],["dbohp","arnold"]],
["dbohp","Développé épaules haltères","🙌","Épaules","Épaules|Triceps","Haltères + banc","dbohp","",["Assis, dos droit, haltères à hauteur des oreilles.","Pousse les haltères vers le haut.","Ne les cogne pas en haut.","Redescends lentement à hauteur des oreilles."],["Dos qui se décolle","Descendre trop bas"],["ohp","arnold"]],
["arnold","Développé Arnold","🌀","Épaules","Épaules (avant + côtés)","Haltères","arnold","",["Haltères devant toi, paumes vers toi.","En poussant, tourne les poignets pour finir paumes vers l'avant.","Tends les bras au-dessus de la tête.","Fais le mouvement inverse en descendant."],["Aller trop vite","Cambrer le dos"],["dbohp","ohp"]],
["lateral","Élévations latérales","🦅","Épaules","Épaules (côtés)","Haltères","lateral","",["Debout, un haltère dans chaque main le long du corps.","Coudes très légèrement fléchis.","Monte les bras sur les côtés jusqu'à hauteur des épaules.","Redescends lentement, sans balancer."],["Prendre trop lourd et balancer","Monter au-dessus des épaules","Hausser les épaules"],["cablelat","uprow"]],
["cablelat","Élévation latérale à la poulie","🦅","Épaules","Épaules (côtés)","Poulie basse","cablelat","",["Poulie basse, attrape la poignée avec la main opposée.","Monte le bras sur le côté jusqu'à l'épaule.","Garde le buste immobile.","Redescends lentement."],["Se pencher pour tricher","Coude trop plié"],["lateral"]],
["frontraise","Élévations frontales","⬆️","Épaules","Épaules (avant)","Haltères ou disque","front","",["Debout, haltères devant les cuisses.","Monte les bras devant toi jusqu'à hauteur des yeux.","Garde le dos droit.","Redescends lentement."],["Balancer le corps","Monter trop haut"],["ohp","lateral"]],
["reardelt","Oiseau (arrière d'épaule)","🐦","Épaules","Arrière d'épaule|Haut du dos","Haltères","reardelt","",["Penche le buste vers l'avant, dos droit.","Haltères sous la poitrine, coudes légèrement fléchis.","Ouvre les bras sur les côtés.","Serre les omoplates puis redescends."],["Prendre trop lourd","Dos rond"],["facepull"]],
["facepull","Face pull","🎭","Épaules","Arrière d'épaule|Trapèzes","Poulie + corde","facepull","",["Poulie à hauteur du visage, corde en main.","Tire la corde vers ton front en écartant les mains.","Coudes hauts, serre les omoplates.","Reviens lentement."],["Coudes trop bas","Tirer avec le dos"],["reardelt"]],
["uprow","Rowing menton","🔼","Épaules","Épaules|Trapèzes","Barre ou haltères","uprow","b",["Debout, barre devant les cuisses, mains largeur d'épaules.","Monte la barre le long du corps, coudes vers le haut.","Arrête-toi à hauteur de poitrine.","Redescends contrôlé."],["Monter trop haut (gêne aux épaules)","Mains trop serrées"],["lateral"]],
["shrug","Shrugs (haussements d'épaules)","🤷","Épaules","Trapèzes","Haltères ou barre","shrug","b",["Debout, charge le long du corps.","Monte les épaules vers les oreilles.","Tiens 1 seconde en haut.","Redescends lentement."],["Rouler les épaules","Plier les bras"],["uprow","farmer"]],

/* ---------- DOS ---------- */
["pullup","Tractions","🧗","Dos","Grand dorsal|Biceps","Barre de traction","pullup","w",["Suspends-toi bras tendus, mains un peu plus larges que les épaules.","Tire les épaules vers le bas et l'arrière.","Monte jusqu'à passer le menton au-dessus de la barre.","Redescends complètement, sans te laisser tomber."],["Se balancer pour monter","Demi-répétitions","Hausser les épaules"],["latpull","invrow"]],
["chinup","Tractions supination","🧗","Dos","Grand dorsal|Biceps","Barre de traction","chinup","w",["Mains largeur d'épaules, paumes vers toi.","Tire jusqu'à passer le menton au-dessus de la barre.","Coudes vers le bas.","Redescends bras tendus."],["Balancer les jambes","Ne pas descendre complètement"],["pullup","latpull"]],
["latpull","Tirage vertical","⬇️","Dos","Grand dorsal|Biceps","Machine poulie","latpull","",["Assieds-toi, cuisses bloquées sous les boudins.","Prends la barre large, buste légèrement incliné en arrière.","Tire la barre vers le haut de la poitrine en serrant les omoplates.","Remonte lentement, bras presque tendus."],["Tirer derrière la nuque","Se pencher beaucoup en arrière"],["pullup","seatedrow"]],
["row","Rowing barre","🚣","Dos","Dos|Biceps|Lombaires","Barre","row","b",["Pieds largeur de hanches, genoux légèrement fléchis.","Penche le buste à ~45°, dos bien droit.","Tire la barre vers le nombril en serrant les omoplates.","Redescends contrôlé, sans arrondir le dos."],["Dos rond","Se redresser pour tricher"],["dbrow","seatedrow","tbar"]],
["dbrow","Rowing haltère un bras","🚣","Dos","Grand dorsal|Biceps","Haltère + banc","dbrow","",["Un genou et une main sur le banc, dos plat.","Haltère dans l'autre main, bras tendu.","Tire l'haltère vers la hanche.","Redescends lentement."],["Tourner le buste","Tirer vers l'épaule au lieu de la hanche"],["row","seatedrow"]],
["seatedrow","Tirage horizontal (poulie)","↔️","Dos","Milieu du dos|Biceps","Poulie basse","seatedrow","",["Assis, pieds sur les cale-pieds, genoux légèrement fléchis.","Dos droit, tire la poignée vers le ventre.","Serre les omoplates.","Reviens bras tendus sans arrondir le dos."],["Se balancer d'avant en arrière","Hausser les épaules"],["row","dbrow"]],

/* ================== CALCULS ================== */
function levelInfo(xp){let lvl=1,need=100,rest=xp;while(rest>=need){rest-=need;lvl++;need=100+(lvl-1)*50}return {lvl,cur:rest,need}}
function title(l){return l>=15?"Légende":l>=10?"Champion":l>=6?"Guerrier":l>=3?"Apprenti":"Débutant"}
function allSets(s){const out=[];s.sessions.forEach(se=>se.entries.forEach(en=>en.sets.forEach(st=>{if(st.done)out.push({...st,ex:en.ex,date:se.date})})));return out}
function totalSets(s){return allSets(s).length}
function totalReps(s){return allSets(s).reduce((a,b)=>a+(+b.reps||0),0)}
function sessionsSince(s,days){const t=Date.now()-days*864e5;return s.sessions.filter(x=>new Date(x.date).getTime()>=t).length}
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.getTime()}
function score(st,ex){return EX[ex]&&EX[ex].bw?(+st.reps||0)+(+st.kg||0)*0.5:(+st.kg||0)*(1+(+st.reps||0)/30)} // Epley
function bestFor(ex,sessions){let best=null;(sessions||S.sessions).forEach(se=>se.entries.forEach(en=>{if(en.ex!==ex)return;en.sets.forEach(st=>{if(!st.done)return;const sc=score(st,ex);if(!best||sc>best.sc)best={sc,kg:+st.kg||0,reps:+st.reps||0,date:se.date}})}));return best}
function stats(){
  const recs=Object.keys(EX).map(k=>bestFor(k)).filter(Boolean).length;
  const force=Math.min(99,5+recs*4+Math.floor(S.prCount*1.5));
  const endu=Math.min(99,5+Math.floor(totalReps(S)/40));
  const reg=Math.min(99,5+sessionsSince(S,28)*7);
  return {force,endu,reg};
}
function quests(){
  const ws=weekStart();const wk=S.sessions.filter(x=>new Date(x.date).getTime()>=ws);
  const wsets=wk.reduce((a,se)=>a+se.entries.reduce((b,en)=>b+en.sets.filter(x=>x.done).length,0),0);
  const wpr=wk.reduce((a,se)=>a+(se.prs||0),0);
  const wreps=wk.reduce((a,se)=>a+se.entries.reduce((b,en)=>b+en.sets.filter(x=>x.done).reduce((c,st)=>c+(+st.reps||0),0),0),0);
  const wpush=wk.reduce((a,se)=>a+se.entries.filter(e=>e.ex==="pushup").reduce((b,en)=>b+en.sets.filter(x=>x.done).reduce((c,st)=>c+(+st.reps||0),0),0),0);
  return [
   {e:"🗓️",n:"Fais 3 séances cette semaine",v:wk.length,max:3,xp:100},
   {e:"🔥",n:"Valide 40 séries cette semaine",v:wsets,max:40,xp:80},
   {e:"🏆",n:"Bats 1 record perso",v:wpr,max:1,xp:60},
   {e:"🔁",n:"Fais 300 répétitions cette semaine",v:wreps,max:300,xp:100}
  ];
}

function lastEntry(ex){for(let i=S.sessions.length-1;i>=0;i--){const en=S.sessions[i].entries.find(e=>e.ex===ex&&e.sets.some(s=>s.done));if(en)return en}return null}
function coachTip(ex,target){
  const E=EX[ex],last=lastEntry(ex);const u=E.timed?"s":"reps";
  if(!last)return E.bw?`Première fois : fais le maximum de ${u} propres, la technique d'abord.`:`Première fois : choisis un poids que tu peux soulever ${target} fois avec une technique parfaite.`;
  const done=last.sets.filter(s=>s.done);const allOk=done.length&&done.every(s=>(+s.reps||0)>=target);
  const kg=Math.max(...done.map(s=>+s.kg||0));
  if(E.bw&&!kg)return allOk?`Tu as tout réussi la dernière fois 💪 Vise ${target+ (E.timed?10:2)} ${u} par série aujourd'hui.`:`Dernière fois : pas toutes les ${u} visées. Même objectif aujourd'hui, tu vas y arriver !`;
  return allOk?`Tu as réussi toutes tes séries à ${kg} kg 💪 Essaie ${+(kg+2.5).toFixed(1)} kg aujourd'hui.`:`Garde ${kg} kg et essaie de faire plus de répétitions que la dernière fois.`;
}
function startProgram(id){
  const p=S.programs.find(x=>x.id===id);
  S.active={pid:id,pn:p.n,start:Date.now(),entries:p.ex.map(([ex,sets,reps])=>mkEntry(ex,sets,reps))};
  save();render();
}
function mkEntry(ex,sets,reps){const last=lastEntry(ex);const E=EX[ex];let kg="";
  if(last){const done=last.sets.filter(s=>s.done);const mx=Math.max(...done.map(s=>+s.kg||0));const ok=done.every(s=>(+s.reps||0)>=reps);kg=mx?(ok?+(mx+2.5).toFixed(1):mx):""}
  return {ex,target:reps,sets:Array.from({length:sets},()=>({kg:E.bw&&!kg?"":kg,reps:reps,done:false}))}}
function vWork(){
  if(!S.active){

      <div style="margin:8px 0">${p.ex.map(e=>`<span class="pill">${EX[e[0]].n} ${e[1]}×${e[2]}${EX[e[0]].timed?"s":""}</span>`).join("")}</div>
      <div class="row"><button class="btn" onclick="startProgram('${p.id}')">Commencer</button>${p.custom?`<button class="btn danger sm" onclick="delProgram('${p.id}')">Suppr.</button>`:""}</div></div>`).join("")+
    `<button class="btn sec" onclick="newProgram()">＋ Créer mon propre programme</button>`;
  }
  const A=S.active;const done=A.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);const tot=A.entries.reduce((a,e)=>a+e.sets.length,0);
  const curXP=A.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+setXP(s,e.ex),0),0);
  return `${A.outdated?`<div class="card" style="border-color:var(--warn)">⚠️ Ce programme a été modifié depuis le début de ta séance. <button class="btn sm" style="margin-top:8px" onclick="S.active.entries.forEach(e=>e.sets.forEach(s=>s.done=false));S.active.outdated=false;refreshPlanSession();render()">Recommencer avec les nouveaux exercices</button></div>`:""}<div class="card"><div class="row between"><div><h3 style="font-size:20px">${esc(A.pn)}</h3><div class="mut">${done}/${tot} séries · +${curXP} XP en cours</div></div><button class="btn danger sm" onclick="cancelWorkout()">Abandonner</button></div>

   <div class="card">${A.entries.map((en,i)=>{const E=EX[en.ex];return `<div class="ex">
     <div class="row between"><div><b style="font-size:16px">${E.ico} ${E.n}</b><div class="mut">${E.m.join(" · ")}</div></div></div>
     <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap"><button class="btn sec sm" onclick="openEx('${en.ex}')">▶ Bonne exécution</button><button class="btn sec sm" onclick="swapMenu(${i})">🔁 Machine prise</button>
       ${E.barbell?`<button class="btn sec sm" onclick="openPlates((S.active.entries[${i}].sets.find(s=>!s.w)||{}).kg)">🧮 Disques</button>`:""}
       ${!E.bw&&!E.timed&&!en.sets.some(s=>s.w)?`<button class="btn sec sm" onclick="addWarmup(${i})">🔥 Échauffement</button>`:""}</div>
     ${lastLine(en.ex)?`<div class="mut" style="margin-top:8px;font-size:13px">${lastLine(en.ex)}</div>`:""}

     ${en.sets.map((s,j)=>`<div class="set" ${s.w?'style="opacity:.75"':''}><span class="n" ${s.w?'style="color:var(--warn)" title="Échauffement"':''}>${s.w?"É":(j+1-en.sets.filter((x,k)=>k<j&&x.w).length)}</span>
       <input inputmode="decimal" value="${s.kg}" placeholder="${E.bw?'0':'kg'}" onchange="upd(${i},${j},'kg',this.value)">
       <input inputmode="numeric" value="${s.reps}" onchange="upd(${i},${j},'reps',this.value)">

     <button class="pill" onclick="addSet(${i})">＋ série</button></div>`}).join("")}</div>
   <button class="btn" onclick="finishWorkout()">🏁 Terminer la séance</button>`;
}
function upd(i,j,k,v){S.active.entries[i].sets[j][k]=v.replace(",",".");save()}
function toggleSet(i,j){const en=S.active.entries[i];const s=en.sets[j];s.done=!s.done;save();render();if(s.done){toast(`+${setXP(s,en.ex)} XP 💥`);startRest(en.rest)}}
function addSet(i){const en=S.active.entries[i];const l=en.sets[en.sets.length-1]||{kg:"",reps:en.target};en.sets.push({kg:l.kg,reps:l.reps,done:false});save();render()}
function cancelWorkout(){modal(`<h2>Abandonner la séance ?</h2><p class="mut">Les séries de cette séance ne seront pas enregistrées.</p><div class="row"><button class="btn sec" onclick="closeModal()">Continuer</button><button class="btn danger" onclick="S.active=null;save();closeModal();stopRest();render()">Abandonner</button></div>`)}
function swapMenu(i){const en=S.active.entries[i];const E=EX[en.ex];

   <div style="height:10px"></div><button class="btn sec" onclick="closeModal()">Annuler</button>`)}
function doSwap(i,a){const en=S.active.entries[i];S.active.entries[i]=mkEntry(a,en.sets.length,en.target);save();closeModal();render();toast("Exercice remplacé ✅")}
function finishWorkout(){
  const A=S.active;const nWarm=A.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done&&s.w).length,0);
  const entries=A.entries.map(e=>({ex:e.ex,target:e.target,sets:e.sets.filter(s=>s.done&&!s.w).map(s=>({kg:+s.kg||0,reps:+s.reps||0,done:true}))})).filter(e=>e.sets.length);
  if(!entries.length){modal(`<h2>Aucune série validée</h2><p class="mut">Coche au moins une série de travail (✓) avant de terminer.</p><button class="btn" onclick="closeModal()">OK</button>`);return}
  const beforeLvl=levelInfo(S.xp).lvl;const qBefore=quests().map(q=>q.v>=q.max);const bossBefore=bossInfo();
  let prs=[];entries.forEach(en=>{const old=bestFor(en.ex);en.sets.forEach(st=>{const sc=score(st,en.ex);if(old&&sc>old.sc+0.01&&!prs.includes(en.ex))prs.push(en.ex)})});
  const nsets=entries.reduce((a,e)=>a+e.sets.length,0);
  const setx=entries.reduce((a,e)=>a+e.sets.reduce((b,st)=>b+setXP(st,e.ex),0),0)+nWarm*5;
  const cats=new Set(entries.map(e=>EX[e.ex]&&EX[e.ex].cat));const athlB=S.cls==="athl"&&cats.size>=3?50:0;
  let xp=setx+50+prs.length*30+athlB;
  const sess={date:new Date().toISOString(),pid:A.pid,pn:A.pn,entries,prs:prs.length,xp,warm:nWarm,min:Math.round((Date.now()-A.start)/60000)};
  S.sessions.push(sess);S.prCount+=prs.length;
  let planMsg="",pxp=0;if(A.plan&&S.plan&&S.plan.id===A.plan){S.plan.done++;const n=planNext();if(n&&n.finished&&!S.plan.rewarded){S.plan.rewarded=true;pxp=300;planMsg=`🏆 Programme « ${n.p.n} » terminé ! +300 XP`}else if(n)planMsg=`📅 ${n.p.n} : séance ${n.done}/${n.tot} validée`}
  const qAfter=quests();let qxp=0;const qDone=[];qAfter.forEach((q,k)=>{if(q.v>=q.max&&!qBefore[k]){qxp+=q.xp;qDone.push(q.n)}});
  const chWon=checkChallenges();let cxp=chWon.reduce((s2,C)=>s2+C.xp,0);if(S.cls==="endu")cxp=Math.round(cxp*1.2);
  const bossNow=bossInfo();const hit=Math.round(sessDamage(sess));let bxp=0;if(bossNow.dead&&!bossNow.claimed){S.bossWon[bossNow.mk]=true;bxp=BOSS_XP}
  xp+=qxp+cxp+bxp+pxp;sess.xp=xp;S.xp+=xp;S.active=null;
  const newB=BADGES.filter(b=>!S.badges.includes(b.id)&&b.t(S));newB.forEach(b=>S.badges.push(b.id));
  save();stopRest();const L=levelInfo(S.xp);const unl=newUnlocks(beforeLvl,L.lvl);pushFriend();

function saveProgram(){const n=document.getElementById("pName").value.trim()||"Mon programme";const s=Math.max(1,+document.getElementById("pSets").value||3),r=Math.max(1,+document.getElementById("pReps").value||10);
  const ex=[...document.querySelectorAll(".pEx:checked")].map(x=>[x.value,s,EX[x.value].timed?Math.max(r,20):r]);
  if(!ex.length){toast("Choisis au moins un exercice");return}
  S.programs.push({id:"c"+Date.now(),n,e:"⚡",ex,custom:true});save();closeModal();render();toast("Programme créé ✅")}
function delProgram(id){S.programs=S.programs.filter(p=>p.id!==id);save();render()}

/* ================== MINUTEUR ================== */
let restEnd=0,restTot=0,restInt=null,actx=null;
function startRest(sec){restTot=sec||S.rest;restEnd=Date.now()+restTot*1000;document.getElementById("timer").classList.add("show");
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest()}
function addRest(d){restEnd+=d*1000;restTot=Math.max(5,restTot+d);tickRest()}
function stopRest(){clearInterval(restInt);document.getElementById("timer").classList.remove("show")}
function tickRest(){const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  document.getElementById("timerT").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  document.getElementById("timerBar").style.width=(restTot?left/restTot*100:0)+"%";
  if(left<=0){stopRest();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast("⏰ Repos terminé, série suivante !")}}
function beep(){try{if(!actx)return;[0,0.25,0.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.15)})}catch(e){}}

const BOSSES=[["Liche de la flemme","💀"],["Démon du canapé","😈"],["Dragon du squat","🐉"],["Kraken des haltères","🐙"],["Golem de fonte","🗿"],["Hydre du cardio","🐍"],

const BOSS_HP=3500,BOSS_XP=500;
const monthKey=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
function bossInfo(){const now=new Date(),mk=monthKey(now),start=new Date(now.getFullYear(),now.getMonth(),1).getTime(),end=new Date(now.getFullYear(),now.getMonth()+1,1).getTime();
  const B=BOSSES[now.getMonth()];let dmg=0;
  S.sessions.filter(s=>{const t=new Date(s.date).getTime();return t>=start&&t<end}).forEach(s=>dmg+=sessDamage(s));
  return {n:B[0],e:B[1],hp:BOSS_HP,dmg:Math.min(BOSS_HP,Math.round(dmg)),left:end-Date.now(),dead:dmg>=BOSS_HP,claimed:!!(S.bossWon||{})[mk],mk}}
function sessDamage(s){let d=0;s.entries.forEach(en=>en.sets.forEach(st=>{if(!st.done||st.w)return;d+=10+Math.min(40,(+st.kg||0)*(+st.reps||0)/40)+(EX[en.ex]&&EX[en.ex].bw?Math.min(15,(+st.reps||0)/2):0)}));
  return S.cls==="force"?d*1.2:d}
function bossCard(){const b=bossInfo(),pc=Math.max(0,100-b.dmg/b.hp*100);const days=Math.ceil(b.left/864e5);

function lastLine(ex){for(let i=S.sessions.length-1;i>=0;i--){const se=S.sessions[i];const en=se.entries.find(e=>e.ex===ex);if(en){const st=en.sets.filter(x=>x.done&&!x.w);if(!st.length)continue;

const PLATES=[[25,"#d33b3b"],[20,"#2f6fd6"],[15,"#e1b322"],[10,"#2e9e4f"],[5,"#e8e8e8"],[2.5,"#555"],[1.25,"#999"]];
let plateBar=20;
function platesFor(target,bar){let side=(target-bar)/2;const out=[];if(side<0)return null;for(const [p] of PLATES){while(side>=p-1e-9){out.push(p);side-=p}}return {out,rest:Math.round(side*2*100)/100}}
function openPlates(kg){kg=+kg||60;
  modal(`<h2>Calcul des disques</h2><p class="mut">Tape le poids total : je te dis quoi mettre de chaque côté de la barre.</p>

   <label class="f">Barre</label><div class="tabs">${[20,15,10].map(b=>`<button class="${plateBar===b?'on':''}" onclick="plateBar=${b};openPlates(document.getElementById('plKg').value)">${b} kg${b===20?' (olympique)':b===15?' (femme)':' (EZ / courte)'}</button>`).join("")}</div>
   <div id="plOut"></div><div style="height:10px"></div><button class="btn" onclick="closeModal()">OK</button>`);drawPlates()}
function drawPlates(){const el=document.getElementById("plOut");if(!el)return;const kg=+String(document.getElementById("plKg").value).replace(",",".");const r=platesFor(kg,plateBar);
  if(!r){el.innerHTML=`<div class="card mut">Le poids est inférieur à la barre (${plateBar} kg).</div>`;return}
  const col=p=>PLATES.find(x=>x[0]===p)[1];
  const vis=r.out.map(p=>`<div title="${p}" style="width:${8+p*.35}px;height:${30+p*2.4}px;background:${col(p)};border-radius:3px;border:1px solid #0006;display:flex;align-items:center;justify-content:center;font-size:8px;color:${p===5?'#222':'#fff'};writing-mode:vertical-rl">${p}</div>`);
  el.innerHTML=`<div class="card" style="margin-top:12px"><div style="display:flex;align-items:center;justify-content:center;gap:2px;height:100px">
    ${[...vis].reverse().join("")}<div style="width:70px;height:8px;background:#c3cad8;border-radius:3px"></div>${vis.join("")}</div>
   <div style="text-align:center;margin-top:8px"><b>De chaque côté :</b> ${r.out.length?groupPl(r.out):"rien, juste la barre"}</div>
   ${r.rest>0?`<div class="mut" style="text-align:center;margin-top:4px">⚠️ Impossible exactement : ${r.rest} kg en trop. Le plus proche : ${kg-r.rest} kg.</div>`:""}</div>`}
function groupPl(a){const m={};a.forEach(p=>m[p]=(m[p]||0)+1);return Object.entries(m).sort((x,y)=>y[0]-x[0]).map(([p,n])=>`${n} × ${String(p).replace(".",",")} kg`).join(" + ")}
function addWarmup(i){const en=S.active.entries[i];const E=EX[en.ex];const first=en.sets.find(s=>!s.w);const top=+(first&&first.kg)||0;
  if(top<20){modal(`<h2>Échauffement</h2><p class="mut">Entre d'abord le poids de ta première série (au moins 20 kg) : je calcule l'échauffement à partir de là.</p><button class="btn" onclick="closeModal()">OK</button>`);return}
  const rd=x=>Math.max(E.barbell?20:2.5,Math.round(x/2.5)*2.5);const ws=[];
  if(E.barbell&&top>40)ws.push({kg:20,reps:10});
  [[.5,8],[.7,5],[.85,3]].forEach(([p,r])=>{const k=rd(top*p);if(k<top&&!ws.some(w=>w.kg===k))ws.push({kg:k,reps:r})});
  en.sets=en.sets.filter(s=>!s.w);en.sets.unshift(...ws.map(w=>({kg:w.kg,reps:w.reps,done:false,w:true})));save();render();toast(`🔥 ${ws.length} séries d'échauffement ajoutées`)}

function addPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!S.premium&&S.photos.length>=3){inp.value="";openPremium();toast("3 photos max en gratuit");return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const W=360,H=Math.round(im.height*W/im.width);const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(im,0,0,W,H);
  const url=c.toDataURL("image/jpeg",.72);S.photos.push({date:new Date().toISOString(),img:url});if(!save()){S.photos.pop();toast("Plus de place pour les photos : supprimes-en une");return}render();toast("Photo ajoutée 📸")};im.src=rd.result};rd.readAsDataURL(f)}

function drawLine(id,pts,unit){const c=document.getElementById(id);if(!c||!pts.length)return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=200;c.width=w*dpr;c.height=h*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const mn=Math.min(...pts)*.98,mx=Math.max(...pts)*1.02||1,pad=34;g.strokeStyle="#2a3142";g.fillStyle="#8b93a7";g.font="11px Inter";
  for(let i=0;i<=3;i++){const y=10+(h-30)*(i/3);g.beginPath();g.moveTo(pad,y);g.lineTo(w-6,y);g.stroke();g.fillText((mx-(mx-mn)*i/3).toFixed(1),2,y+4)}
  const X=i=>pts.length===1?(w+pad)/2:pad+(w-pad-12)*i/(pts.length-1),Y=v=>10+(h-30)*(1-(v-mn)/((mx-mn)||1));
  const grd=g.createLinearGradient(0,0,w,0);grd.addColorStop(0,"#ff7a1a");grd.addColorStop(1,"#ff7a1a");g.strokeStyle=grd;g.lineWidth=3;g.beginPath();pts.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  g.fillStyle="#ff7a1a";pts.forEach((v,i)=>{g.beginPath();g.arc(X(i),Y(v),4,0,7);g.fill()})}

/* ================== CALENDRIER / SÉRIES ================== */
let calOff=0;
const dayKey=d=>{d=new Date(d);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function streaks(){const days=new Set(S.sessions.map(s=>dayKey(s.date)));
  let ds=0;const d=new Date();if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);while(days.has(dayKey(d))){ds++;d.setDate(d.getDate()-1)}
  const wk=t=>{const x=new Date(t);const dd=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-dd);return x.getTime()};
  const cnt={};S.sessions.forEach(s=>{const k=wk(s.date);cnt[k]=(cnt[k]||0)+1});
  const sh=(t,n)=>{const x=new Date(t);x.setDate(x.getDate()+n*7);return x.getTime()};
  let cur=wk(Date.now()),ws=0;const thisWeek=cnt[cur]||0;if(thisWeek>=2)ws++;let t=sh(cur,-1);while((cnt[t]||0)>=2){ws++;t=sh(t,-1)}
  let best=0,run=0;const ks=Object.keys(cnt).map(Number).sort((a,b)=>a-b);if(ks.length){for(let k=ks[0];k<=cur;k=sh(k,1)){if((cnt[k]||0)>=2){run++;best=Math.max(best,run)}else if(k!==cur)run=0}}best=Math.max(best,ws);
  return {ds,ws,best,thisWeek}}
function vCal(){const now=new Date();const ref=new Date(now.getFullYear(),now.getMonth()+calOff,1);const y=ref.getFullYear(),mo=ref.getMonth();
  const per={};S.sessions.forEach(s=>{const k=dayKey(s.date);(per[k]=per[k]||[]).push(s)});
  const first=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate();const st=streaks();
  const monthN=S.sessions.filter(s=>{const d=new Date(s.date);return d.getFullYear()===y&&d.getMonth()===mo}).length;
  let cells="";for(let i=0;i<first;i++)cells+=`<div></div>`;
  for(let d=1;d<=nd;d++){const k=y+"-"+(mo+1)+"-"+d,ss=per[k]||[];const today=calOff===0&&d===now.getDate();
    cells+=`<button onclick="calDay('${k}')" style="aspect-ratio:1;border-radius:10px;font-size:13px;${ss.length?'background:var(--acc);color:#071205;font-weight:700':'background:var(--card2);color:var(--mut)'};${today?'outline:2px solid #fff;':''}">${d}${ss.length>1?`<sup>×${ss.length}</sup>`:""}</button>`}
  return `<div class="grid2" style="margin-bottom:12px">
    <div class="card" style="margin:0"><div class="mut">🔥 Série de semaines</div><div class="big" style="font-size:28px">${st.ws}</div><div class="mut" style="font-size:12px">2 séances/semaine min. · record ${st.best}</div></div>
    <div class="card" style="margin:0"><div class="mut">📆 Jours d'affilée</div><div class="big" style="font-size:28px">${st.ds}</div><div class="mut" style="font-size:12px">${st.thisWeek} séance(s) cette semaine</div></div></div>
   <div class="card"><div class="row between"><button class="btn sec sm" onclick="calOff--;render()">‹</button><b style="font-size:17px;text-transform:capitalize">${ref.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</b><button class="btn sec sm" onclick="calOff++;render()" ${calOff>=0?'disabled style="opacity:.3"':''}>›</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;text-align:center">${["L","M","M","J","V","S","D"].map(x=>`<div class="mut" style="font-size:11px">${x}</div>`).join("")}${cells}</div>
    <div class="mut" style="margin-top:10px">${monthN} séance(s) ce mois-ci</div><div id="calDayOut"></div></div>`}
function calDay(k){const ss=S.sessions.filter(s=>dayKey(s.date)===k);const el=document.getElementById("calDayOut");if(!el)return;
  el.innerHTML=ss.length?ss.map(s=>`<div class="exitem"><div class="grow"><b>${esc(s.pn)}</b><div class="mut">${s.entries.map(e=>EX[e.ex]?EX[e.ex].n:"").join(", ")}</div></div><span class="pill" style="color:var(--acc)">+${s.xp} XP</span></div>`).join(""):`<div class="mut" style="margin-top:8px">Repos ce jour-là 😴</div>`}

/* ================== NOTIFICATIONS ================== */
function notifs(){const out=[];const now=Date.now();
  S.challenges.active.forEach(a=>{const st=chState(a);if(st.expired)out.push({k:"exp"+a.id+a.start,e:"❌",t:`Défi « ${st.C.n} » raté. Réessaie ou retire-le !`,go:"fr"});
    else if(st.left<48*36e5)out.push({k:"end"+a.id+a.start,e:"⏰",t:`Ton défi « ${st.C.n} » se termine dans ${fmtLeft(st.left).replace(" restants","").replace(" restantes","")}. Il te reste ${fmtN(st.C.goal-st.v)} ${st.C.u}.`,go:"fr"})});
  const last=S.sessions.length?new Date(S.sessions[S.sessions.length-1].date).getTime():0;const gap=last?Math.floor((now-last)/864e5):-1;
  if(gap>=3)out.push({k:"gap"+Math.floor(now/864e5),e:"👀",t:`Ça fait ${gap} jours sans séance. On y retourne ?`,go:"work"});
  const st=streaks();const dow=(new Date().getDay()+6)%7;if(st.ws>0&&st.thisWeek<2&&dow>=4)out.push({k:"streak"+weekStart(),e:"🔥",t:`Ta série de ${st.ws} semaine(s) est en danger : encore ${2-st.thisWeek} séance(s) avant dimanche !`,go:"work"});
  const b=bossInfo();if(!b.dead&&b.left<7*864e5)out.push({k:"boss"+b.mk,e:b.e,t:`${b.n} a encore ${fmtN(b.hp-b.dmg)} PV et il reste ${Math.ceil(b.left/864e5)} jour(s) pour le battre !`,go:"home"});
  if(b.dead&&!b.claimed)out.push({k:"bossw"+b.mk,e:"🏆",t:`Tu as vaincu ${b.n} ! Termine une séance pour récupérer tes ${BOSS_XP} XP.`,go:"work"});
  quests().forEach((q,i)=>{if(q.v<q.max&&q.v/q.max>=.7)out.push({k:"q"+i+weekStart(),e:"📜",t:`Presque fini : « ${q.n} » (${q.v}/${q.max}).`,go:"home"})});
  const L=levelInfo(S.xp);if(L.need-L.cur<=60)out.push({k:"lv"+L.lvl,e:"⬆️",t:`Plus que ${L.need-L.cur} XP avant le niveau ${L.lvl+1} !`,go:"work"});
  (FR.passed||[]).forEach(p=>out.push({k:"pass"+p.id+weekStart()+p.x,e:"⚔️",t:`${p.n} t'a dépassé au classement de la semaine !`,go:"fr"}));
  if(!S.cls)out.push({k:"cls",e:"🎭",t:"Choisis ta classe pour gagner des bonus d'XP.",act:"chooseClass()"});
  return out}
function openNotifs(){const n=notifs();n.forEach(x=>{if(!S.seenN.includes(x.k))S.seenN.push(x.k)});S.seenN=S.seenN.slice(-200);save();
  modal(`<h2>Notifications</h2>${n.length?n.map(x=>`<div class="exitem" style="cursor:pointer" onclick="closeModal();${x.act?x.act:`go('${x.go}')`}"><div class="ico">${x.e}</div><div class="grow" style="font-size:14px">${esc(x.t)}</div><span class="mut">›</span></div>`).join(""):`<div class="empty">Rien de neuf pour l'instant 👌</div>`}

  try{await FR.db.doc("players/"+FR.me).set(d)}catch(e){if(e&&e.code==="invalid_argument"){FR.canWrite=false;if(tab==="fr")render()}}}

  <button class="btn" style="margin-top:10px" ${coachBusy?"disabled":""} onclick="askCoach()">${coachBusy?"Analyse en cours…":coachTxt?"🔁 Nouvelle analyse":"Analyser mes séances"}</button></div>`}
async function askCoach(){if(!S.premium){openPremium();return}if(!S.sessions.length){toast("Fais d'abord au moins une séance");return}
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){}
  const recent=S.sessions.slice(-10).map(s=>({date:s.date.slice(0,10),seance:s.pn,exos:s.entries.map(e=>({exo:EX[e.ex]?EX[e.ex].n:e.ex,series:e.sets.map(x=>(x.kg?x.kg+"kg×":"")+x.reps)}))}));
  const vol=weekVolume();
  if(!sample){coachTxt=ruleCoach(vol);render();return}
  coachBusy=true;coachTxt="";render();
  const prompt=`Tu es le coach de musculation de l'appli MuscuQuest. Réponds en français, en tutoyant, de façon motivante mais honnête, en 6 à 10 lignes maximum, sans markdown (texte simple, tu peux utiliser des tirets et 2-3 emojis).
Base-toi uniquement sur ces repères reconnus : entraîner chaque muscle au moins 2 fois par semaine ; environ 10 séries par muscle et par semaine pour la prise de muscle ; pour la force, charges lourdes (environ 80 % du max) ; progresser en ajoutant des répétitions puis du poids ; 2 à 3 minutes de repos sur les gros mouvements ; la régularité compte plus que la complexité.
Ne donne aucun conseil médical, aucun chiffre de calories ni de régime. Si quelque chose semble douloureux ou risqué, conseille de demander à un professionnel.
Données de l'utilisateur — classe : ${S.cls||"aucune"} ; programme suivi : ${S.plan?PACKS.find(p=>p.id===S.plan.id).n:"aucun"} ; séries par groupe musculaire sur 7 jours : ${JSON.stringify(vol)} ; 10 dernières séances : ${JSON.stringify(recent)}.
Donne : 1) ce qui va bien, 2) les 2 ou 3 points à améliorer en priorité, 3) un objectif précis pour la prochaine séance.`;
  try{const r=await sample(prompt,{modelTier:"default",onText:({text})=>{coachTxt=text;const el=document.getElementById("coachOut");if(el)el.textContent=text}});coachTxt=r.text}
  catch(e){coachTxt=e&&e.code==="rate_limited"?"Le coach est très demandé, réessaie dans un moment.":ruleCoach(vol)}
  coachBusy=false;render()}
function ruleCoach(v){const low=Object.entries(v).filter(([k,n])=>n<4&&["Pectoraux","Dos","Quadriceps","Ischios","Fessiers","Épaules"].includes(k)).map(([k])=>k);
  const st=streaks();let t=`📊 Cette semaine : ${S.sessions.filter(s=>new Date(s.date).getTime()>Date.now()-7*864e5).length} séance(s).\n`;
  t+=low.length?`- À travailler : ${low.join(", ")} (moins de 4 séries en 7 jours). Vise au moins 2 séances par semaine pour chaque muscle.\n`:"- Bon équilibre entre les groupes musculaires 👍\n";
  t+=st.ws?`- Série de ${st.ws} semaine(s) : garde ce rythme, la régularité est ce qui compte le plus.\n`:"- Objectif : 2 séances minimum cette semaine pour lancer ta série 🔥\n";
  t+="- Progression : quand toutes tes séries sont réussies proprement, ajoute 1 à 2 reps, puis un peu de poids.\n(Analyse simple : le coach IA complet n'est pas disponible sur cet écran.)";return t}

const CLOUD={ok:false,state:"off",last:0,busy:false,dirty:false,timer:null,err:""};
function cloudDoc(){return FR.db&&FR.me?FR.db.doc("data/users/"+FR.me+"/save"):null}
function cloudPayload(){const o=JSON.parse(JSON.stringify(S));o.photos=[];return o}
function scheduleCloud(){if(!CLOUD.ok)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,2500)}
async function cloudPush(){const d=cloudDoc();if(!d)return;if(CLOUD.busy){CLOUD.dirty=true;return}CLOUD.busy=true;
  try{const p=cloudPayload();if(JSON.stringify(p).length>240000){p.sessions=p.sessions.slice(-300)}await d.set({save:p,savedAt:S.savedAt||Date.now(),lvl:levelInfo(S.xp).lvl});CLOUD.last=Date.now();CLOUD.state="ok";CLOUD.err=""}
  catch(e){CLOUD.state="err";CLOUD.err=e&&e.code||"erreur"}
  CLOUD.busy=false;if(CLOUD.dirty){CLOUD.dirty=false;scheduleCloud()}}
async function initCloud(){const d=cloudDoc();if(!d)return;CLOUD.ok=true;CLOUD.state="sync";
  try{const snap=await d.get();if(snap.exists){const c=snap.data();const local=S.savedAt||0;
      if(c.save&&c.savedAt>local+5000){if(!S.sessions.length&&!S.xp){restoreCloud(c,true)}else{askRestore(c)}}else cloudPush()}
    else cloudPush();CLOUD.state=CLOUD.state==="sync"?"ok":CLOUD.state}catch(e){CLOUD.state="err";CLOUD.err=e&&e.code||"erreur"}}
function restoreCloud(c,silent){const ph=S.photos;S=Object.assign(blank(),c.save,{photos:ph});S.savedAt=c.savedAt;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}closeModal();render();toast("☁️ Sauvegarde restaurée");if(!silent)CLOUD.last=Date.now()}
let pendingCloud=null;
function askRestore(c){pendingCloud=c;modal(`<h2>Sauvegarde trouvée</h2><p class="mut">Une sauvegarde plus récente existe dans ton cloud (niveau ${c.lvl||"?"}, ${new Date(c.savedAt).toLocaleString("fr-FR")}). Tu l'as sûrement utilisée sur un autre appareil.</p>
  <div class="card"><div class="mut">Sur cet appareil : niveau ${levelInfo(S.xp).lvl}, ${S.sessions.length} séance(s)</div></div>
  <button class="btn" onclick="restoreCloud(pendingCloud)">Utiliser la sauvegarde du cloud</button><div style="height:8px"></div><button class="btn sec" onclick="closeModal();cloudPush()">Garder celle de cet appareil</button>`)}
function cloudLine(){if(!CLOUD.ok)return `<p class="mut" style="margin-top:12px">☁️ Sauvegarde cloud indisponible sur cet écran : tes données restent sur cet appareil.</p>`;
  return `<div class="card" style="margin-top:12px"><b>☁️ Sauvegarde cloud</b><div class="mut" style="margin-top:4px">${CLOUD.state==="err"?"⚠️ Échec de la dernière sauvegarde ("+esc(CLOUD.err)+")":CLOUD.last?"Dernière sauvegarde à "+new Date(CLOUD.last).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"Synchronisation…"}. Ta progression te suit sur tous tes appareils (les photos restent sur ce téléphone).</div>
   <button class="btn sec sm" style="margin-top:8px" onclick="cloudPush().then(()=>{toast('☁️ Sauvegardé');openSettings()})">Sauvegarder maintenant</button></div>`}

function refreshPlanSession(){const A=S.active;if(!A||!A.plan)return;const p=PACKS.find(x=>x.id===A.plan);if(!p)return;
  const dn=A.dayN||(A.pn||"").split(" — ").pop();const day=p.days.find(d=>d.n===dn);if(!day)return;
  const want=day.ex.map(e=>e[0]).join(),have=A.entries.map(e=>e.ex).join();if(want===have)return;
  if(A.entries.some(e=>e.sets.some(s=>s.done))){A.outdated=true;return}
  A.entries=day.ex.map(([ex,s,r,rs])=>{const en=mkEntry(ex,s,r);en.rest=rs;return en});A.dayN=dn;save();setTimeout(()=>toast("🔄 Séance mise à jour avec le nouveau programme"),600)}

  return `<div class="card" style="border-style:dashed;margin-top:16px"><div class="mut" style="font-size:11px;text-transform:uppercase;letter-spacing:1px">Publicité (exemple)</div>
   <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap"><button class="btn sec sm" ${can?"":"disabled style='opacity:.4'"} onclick="watchAd()">Regarder une pub : +25 XP</button><button class="btn sec sm" onclick="openPremium()">Retirer les pubs</button></div></div>`}

if(FREE&&!S.premium){S.premium={since:Date.now(),free:1};save()}
refreshPlanSession();
render();initFriends();if(!S.onboarded){if(S.sessions.length){S.onboarded=true;save()}else onboarding()}
